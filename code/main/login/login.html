<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>商城系统 - 登录与注册</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px #eee; }
        input { display: block; margin: 10px 0; padding: 8px; width: 200px; }
        button { padding: 8px 15px; cursor: pointer; margin-right: 5px; }
        #result { margin-top: 15px; font-weight: bold; color: #333; }
        .btn-register { background-color: #f0f0f0; border: 1px solid #ccc; }
        .btn-login { background-color: #007bff; color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h3>用户认证</h3>
        <input type="text" id="username" placeholder="用户名">
        <input type="password" id="password" placeholder="密码">
        
        <button class="btn-login" onclick="handleAuth('login')">登录</button>
        <button class="btn-register" onclick="handleAuth('register')">注册</button>
        
        <div id="result"></div>
    </div>

    <script>
        // 为了代码简洁，我把登录和注册逻辑整合到了一个处理函数中
        async function handleAuth(type) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');

            if (!username || !password) {
                resultDiv.innerText = '请填写完整信息';
                return;
            }

            // 注意：这里端口改为 8000，以匹配 C++ 后端的监听端口
            const url = `http://localhost:8000/${type}`;
            
            try {
                resultDiv.innerText = '正在处理...';
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.style.color = 'green';
                    resultDiv.innerText = (type === 'login' ? '登录成功！' : '注册成功！请登录。');
                } else {
                    resultDiv.style.color = 'red';
                    resultDiv.innerText = (type === 'login' ? '登录失败：' : '注册失败：') + data.message;
                }
            } catch (error) {
                resultDiv.style.color = 'red';
                resultDiv.innerText = '错误：无法连接到服务器';
                console.error('Fetch Error:', error);
            }
        }
    </script>
</body>
</html>
